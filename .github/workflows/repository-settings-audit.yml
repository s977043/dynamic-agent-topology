name: Repository settings audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only repository settings audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Audit repository settings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_repository_settings.py \
            --repository "${GITHUB_REPOSITORY}" \
            | tee repository-settings-audit.txt

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Repository settings audit"
            echo
            if [[ -f repository-settings-audit.txt ]]; then
              echo '```text'
              cat repository-settings-audit.txt
              echo '```'
              echo
              echo "> DRIFT / UNKNOWN are observational evidence and do not fail this workflow. API or audit execution failure does."
            else
              echo "Audit output was not produced. Inspect the failed audit step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-settings-audit
          path: repository-settings-audit.txt
          if-no-files-found: ignore
          retention-days: 14
