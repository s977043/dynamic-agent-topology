name: dat-validate

on:
  pull_request:
    paths:
      - ".dat/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".antigravity/**"
  push:
    branches: [main]
    paths:
      - ".dat/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".antigravity/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout DAT
        uses: actions/checkout@v4
        with:
          repository: s977043/dynamic-agent-topology
          ref: "REPLACE_WITH_PINNED_DAT_REF"
          path: .dat-vendor/dynamic-agent-topology

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install jsonschema pyyaml

      - name: Validate DAT project binding
        run: |
          python .dat-vendor/dynamic-agent-topology/scripts/validate_project.py \
            --project . \
            --dat-root .dat-vendor/dynamic-agent-topology
