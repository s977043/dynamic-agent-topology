# 難度の高い Task での T0/T1 比較の候補表（#244、事前登録 §3・§9 手順 2）
# 事前登録: docs/HARD_TASK_T0_T1_PREREGISTRATION.md（blob 52b4a585044e00d52fea8db64f725c4b4f3258cd）
# 状態: 候補表の第 2 版（PR #245 の独立レビュー指摘で選定規則を一律化）。§9 手順 3 の固定（blob hash の Issue 記録・独立レビュー）は未実施。model は起動していない
# 順序: orderKey（"<repo URL>@<revision>" の UTF-8 文字列）の SHA-256 の昇順。同じ orderKey は 1 件まで。
#   先頭 C 件が initial（初回の候補）、残りが reserve（追加分の予備、先頭から使う）。手で並べ替えない
# revision はバグ修正 commit（fixCommit）の親。AC は fixCommit で追加・変更されたテスト
# 決定性: revision に fixCommit のテストファイルを重ねた状態で 3 回失敗、fixCommit で 3 回成功を確認
#   （CPython 3.12.13、python -m unittest、sandbox-exec でネットワーク遮断）
# taskNature: exploratory（探索）/ replication（複製）/ known-solution（既知解）。較正結果のない時点で
#   Agent 1 名が件名・本文・diff から付けた暫定値（評定者間一致は NOT_TESTED）
# excluded: 機械的な一次条件（件名・規模・テスト変更）を通過して確認した候補のうち、条件を満たさない・除外条件に当たるもの
selectionRule:
  version: 2
  adopted: "全 repo 一律で、一次条件を満たす commit を新しい順に最大 N = 40 件まで確認する（レビュー指摘の第 2 案）"
  why: "第 1 案（上限なし・全件確認）は sqlglot だけで一次条件を満たす commit が千件規模あり、1 件あたり 6 回のテスト実行で実行時間が過大になるため。N は各 repo の合格件数を数える前に、実行時間（sqlglot 40 件でおよそ 20 分）だけを基準に決めた"
  caveat: "N を決めた時点で、第 1 版（上限 6/12/20）の結果は見ていた。N は合格件数ではなく確認件数の上限で、sqlglot と pyparsing 以外の repo は 40 件に届かず一次条件を満たす commit を全件確認した"
  appliedAt: {start: "2026-10-23T18:56:11Z", end: "2026-10-23T20:02:22Z"}
  repos: "26 repo（下の populationStats.perRepo。0 件の repo も含む）"
  primaryFilter:
    since: "2019-01-01（author date）"
    log: "git log --no-merges --since=2019-01-01 -i --grep=fix --grep=bug、新しい順"
    subject: "件名が fix/fixes/fixed/fixing/bug/bugfix/bugs を単語として含み、typo/codespell/lint/flake8/mypy/ruff/black/ci/doc(s)/documentation/readme/changelog/spelling/warning(s)/deprecat* を含まない"
    parents: "親が 1 つ（merge commit を除く）。rename を含む commit を除く"
    size: "テスト以外・ドキュメント以外のファイルの変更が 2 ファイル以上または 30 行以上（事前登録 §3 の目安を、テストを数えない厳しい側で適用）"
    tests: "fixCommit がテストモジュール（test_*.py など）を追加・変更している"
  mechanicalChecks:
    runner: "CPython 3.12.13、python -s -B -m unittest <AC モジュール>、sandbox-exec でネットワーク遮断・書き込みを作業ディレクトリに限定、各 300 秒で打ち切り"
    afterFix: "fixCommit で 3 回とも exit 0"
    beforeFix: "revision に fixCommit のテストファイルを重ねて 3 回とも非 0、かつ失敗テスト ID が 3 回で同一"
  ordering: "合格かつ AC 意図確認で consistent の候補を、orderKey の SHA-256 昇順に並べ、先頭 2C 件。AC 意図確認は SHA 順に先頭から行い、inconsistent は excluded に移して次の候補で補う"
  acIntentCheck: "表に載る全候補と、SHA 順で 2C 件に達するまでに確認した候補について、fixCommit の修正 diff と AC テストの差分・修正前に失敗するテストを読んで対応を判定（Agent 1 名）"
judgments:
  - id: unittest-only
    rule: "AC は python -m unittest で実行できるものに限る。pytest 等の外部パッケージは入れない"
    why: "検証環境に pytest がなく、PyPI からの取得は許可範囲外だったため。母集団が外部依存のない Python ライブラリに偏る"
    effect: "修正後に AC が通らない除外（pytest 依存・環境非互換を含む）として excludedByReason に計上"
  - id: since-2019
    rule: "fixCommit の author date が 2019-01-01 以降"
    why: "CPython 3.12 で修正前後のテストが動く可能性が高い範囲に限るため。確定版にない条件"
    effect: "2019 年より前の commit は確認していない（件数は数えていない）"
  - id: import-collection-errors
    rule: "修正前の失敗が import・収集エラー（unittest の _FailedTest）だけの候補は除外"
    why: "失敗するテストを特定できず、AC が修正の意図を表すか判定できないため"
    effect: "excludedByReason の「修正前の失敗がテスト単位で特定できない」に計上"
  - id: task-nature-provisional
    rule: "taskNature は較正前に Agent 1 名が件名・本文・diff から付けた暫定値"
    why: "事前登録 §8 は結果を見ない担当者を求めるが、Human 評定者は未確保。較正結果はまだ存在しない"
    effect: "評定者間一致は NOT_TESTED。主判定には使わない（§8）"
  - id: license-at-revision
    rule: "repo のライセンスは LICENSE 系ファイルの 2019 年以降の履歴を確認して判定。GitHub の検出値が NOASSERTION または実態と異なる repo は LICENSE 本文で判定"
    why: "python-pathspec は GitHub の検出が MIT だが、pyproject.toml と LICENSE-MPL-2.0 では MPL-2.0（MIT への再ライセンスは未完了）であり、第 1 版の記録が誤っていたため"
    effect: "python-pathspec を MPL-2.0 として記録。他 repo の LICENSE の変更は年号・書式だけ"
