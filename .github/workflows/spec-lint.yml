name: spec-lint

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema jsonschema pyyaml

      - name: Validate JSON Schemas
        run: check-jsonschema --check-metaschema schemas/*.json

      - name: Validate canonical topologies
        run: |
          for file in topologies/canonical/*.yaml; do
            check-jsonschema --schemafile schemas/topology.schema.json "$file"
          done

      - name: Validate execution baselines
        run: |
          for file in baselines/*.yaml; do
            check-jsonschema --schemafile schemas/execution-baseline.schema.json "$file"
          done

      - name: Validate roles
        run: |
          for file in roles/*.yaml; do
            check-jsonschema --schemafile schemas/role.schema.json "$file"
          done

      - name: Validate routing policies
        run: |
          for file in policies/routing/*.yaml; do
            check-jsonschema --schemafile schemas/routing-policy.schema.json "$file"
          done

      - name: Validate escalation policies
        run: |
          for file in policies/escalation/*.yaml; do
            check-jsonschema --schemafile schemas/escalation-policy.schema.json "$file"
          done

      - name: Validate runtime capability manifests
        run: |
          for file in adapters/*/capabilities.yaml; do
            check-jsonschema --schemafile schemas/runtime-capability.schema.json "$file"
          done

      - name: Validate brownfield example schemas
        run: |
          check-jsonschema --schemafile schemas/project-binding.schema.json examples/brownfield/.dat/project.yaml
          check-jsonschema --schemafile schemas/evidence-profile.schema.json examples/brownfield/.dat/evidence.yaml
          check-jsonschema --schemafile schemas/project-policy.schema.json examples/brownfield/.dat/policy.yaml
          check-jsonschema --schemafile schemas/runtime-binding.schema.json examples/brownfield/.dat/runtimes.yaml
          check-jsonschema --schemafile schemas/dat-lock.schema.json examples/brownfield/.dat/dat.lock.yaml

      - name: Validate external project adoption
        run: |
          python scripts/validate_project.py --project examples/brownfield --dat-root .
          python scripts/test_validate_project.py

      - name: Semantic validation
        run: python scripts/validate_semantics.py

      - name: Validate experiments
        run: |
          for file in experiments/EXP-*/experiment.yaml; do
            check-jsonschema --schemafile schemas/experiment.schema.json "$file"
          done
          for file in experiments/EXP-*/scenarios/*.yaml; do
            check-jsonschema --schemafile schemas/scenario-set.schema.json "$file"
          done

      - name: Validate experiment run examples
        run: |
          for file in examples/experiment-run/*-trace.yaml; do
            check-jsonschema --schemafile schemas/execution-trace.schema.json "$file"
          done
          for file in examples/experiment-run/*-evaluation.yaml; do
            check-jsonschema --schemafile schemas/evaluation.schema.json "$file"
          done

      - name: Experiment semantic validation
        run: python scripts/validate_experiments.py

      - name: Experiment summary smoke test
        run: python scripts/summarize_experiment.py examples/experiment-run/*-evaluation.yaml

      - name: Validate failing experiment fixtures
        run: python scripts/validate_fixtures.py

      - name: Validate experiment pilot schema
        run: |
          check-jsonschema --schemafile schemas/pilot.schema.json experiments/EXP-001-t0-vs-t1/pilot/pilot.yaml

      - name: Validate experiment pilot plan
        run: |
          python scripts/validate_pilot.py \
            --pilot experiments/EXP-001-t0-vs-t1/pilot/pilot.yaml \
            --matrix experiments/EXP-001-t0-vs-t1/pilot/run-matrix.yaml

      - name: Verify deterministic pilot matrix
        run: |
          python scripts/generate_pilot_matrix.py \
            --pilot experiments/EXP-001-t0-vs-t1/pilot/pilot.yaml \
            > /tmp/run-matrix.yaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          expected = yaml.safe_load(Path("experiments/EXP-001-t0-vs-t1/pilot/run-matrix.yaml").read_text())
          generated = yaml.safe_load(Path("/tmp/run-matrix.yaml").read_text())
          if expected != generated:
              raise SystemExit("generated pilot matrix differs semantically from committed matrix")
          print("deterministic pilot matrix OK")
          PY

      - name: Test experiment pilot validator
        run: python scripts/test_validate_pilot.py

      - name: Test experiment operator kit
        run: python scripts/test_operator_kit.py

      - name: Validate EXP-001 feature freeze
        run: python scripts/validate_experiment_freeze.py

      - name: Test EXP-001 feature freeze validator
        run: python scripts/test_validate_experiment_freeze.py
