apiVersion: dat/v1alpha1
kind: RuntimeCapabilityManifest
metadata:
  runtime: codex
  variant: cli
  verifiedAt: "2026-10-04"
capabilities:
  custom_roles:
    status: native
    source: https://developers.openai.com/ja-JP/docs/config-file/config-reference
    note: agents.<name> declares custom multi-agent roles with role-specific config files.
  isolated_context:
    status: native
    source: https://developers.openai.com/api/docs/guides/agents-api/multi-agent
    note: The managed Codex harness documents independent subagent contexts; CLI mapping must preserve this contract.
  parallel_subagents:
    status: native
    source: https://developers.openai.com/api/docs/guides/agents-api/multi-agent
  permission_scoping:
    status: native
    source: https://developers.openai.com/ja-JP/docs/config-file/config-reference
    note: Role config layers can carry sandbox and approval settings.
  tool_scoping:
    status: unknown
    note: DAT will not assume per-role tool scoping until a stable CLI contract is verified.
  runtime_hooks:
    status: unknown
  workspace_isolation:
    status: unknown
  remote_agents:
    status: unknown
