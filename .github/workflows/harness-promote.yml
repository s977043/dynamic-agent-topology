name: Harness Promote
on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * 1"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: harness-promote
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - name: Propose repeated candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/harness_promote.py --repo "$GITHUB_REPOSITORY" --publish
