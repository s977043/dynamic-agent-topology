name: Harness Promote
on:
  push:
    branches: [main]
    paths: [".github/workflows/harness-promote.yml"]
  workflow_dispatch:
  schedule:
    - cron: "13 7 * * 1"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: harness-promote
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
      - name: Record checkout revision
        run: git rev-parse HEAD
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ci.txt
      - name: Propose repeated candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/harness_promote.py --repo "$GITHUB_REPOSITORY" --publish
