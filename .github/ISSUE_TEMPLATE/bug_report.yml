name: Bug report
description: Report a reproducible defect in DAT specifications, validators, examples, or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Do not include secrets, private source code, or sensitive vulnerability details here. See SECURITY.md for security reports.
        Use the Engineering Layer fields to identify the smallest broken unit before proposing more topology or coordination.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: A concise description of the defect.
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: DAT version or commit
      description: Tag, version, or commit SHA where you observed the problem.
      placeholder: v0.2.1 or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: engineering_layer
    attributes:
      label: Affected Engineering Layer
      description: Select the primary diagnostic layer. Choose Cross-layer / Unknown if evidence is not sufficient yet.
      options:
        - Prompt
        - Context
        - Harness
        - Loop
        - Graph
        - Evaluation
        - Cross-layer / Unknown
    validations:
      required: true

  - type: textarea
    id: work_unit
    attributes:
      label: Broken Work Unit
      description: Identify the smallest unit that appears broken, such as a role contract, handoff, adapter, policy, permission binding, validator, or evidence path.
      placeholder: verifier capability binding
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected_invariant
    attributes:
      label: Expected invariant
      description: What property or behavior should always hold?
      placeholder: The verifier must not receive write-capable tools.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Observed evidence
      description: Sanitized logs, validator output, trace excerpts, or a minimal fixture. Remove confidential information.
      render: shell

  - type: textarea
    id: verification
    attributes:
      label: Verification method
      description: How should the invariant be checked after the fix? Prefer deterministic or observable evidence where possible.
      placeholder: capability manifest validation + runtime trace
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not contain secrets or sensitive vulnerability details.
          required: true
